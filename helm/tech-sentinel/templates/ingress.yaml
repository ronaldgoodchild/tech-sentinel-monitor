{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.tls }}
{{- fail "ingress.tls must be configured when ingress is enabled. Plaintext HTTP ingress exposes API keys and tokens to interception. Set ingress.tls with appropriate certificates or disable ingress." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tech-sentinel.fullname" . }}
  labels:
    {{- include "tech-sentinel.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                {{- if eq .service "api" }}
                name: {{ include "tech-sentinel.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.api.port }}
                {{- else }}
                name: {{ include "tech-sentinel.fullname" $ }}-status-page
                port:
                  number: {{ $.Values.service.statusPage.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
