apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tech-sentinel.fullname" . }}-secrets
  labels:
    {{- include "tech-sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.database.password | default "changeme" | quote }}
  {{- if not .Values.config.jwtSecret }}
  {{- fail "config.jwtSecret is required and must be set to a cryptographically random value (minimum 32 bytes). Generate with: openssl rand -base64 32" }}
  {{- end }}
  TS_JWT_SECRET: {{ .Values.config.jwtSecret | quote }}
  TS_API_KEY: {{ .Values.config.apiKey | default "changeme" | quote }}
