apiVersion: v1
kind: Secret
metadata:
  name: '{{ include "tech-sentinel.fullname" . }}-secrets'
  labels:
    {{- include "tech-sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: '{{ required "database.password is required" .Values.database.password }}'
  REDIS_PASSWORD: '{{ required "redis.password is required" .Values.redis.password }}'
  TS_JWT_SECRET: '{{ required "config.jwtSecret is required" .Values.config.jwtSecret }}'
  TS_API_KEY: '{{ required "config.apiKey is required" .Values.config.apiKey }}'
