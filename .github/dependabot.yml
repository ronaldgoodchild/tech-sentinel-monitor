# Keeps dependencies and CI actions up to date with weekly pull requests.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
  - package-ecosystem: "pip"
    directory: "/control-plane"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
  - package-ecosystem: "pip"
    directory: "/probe-worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
  - package-ecosystem: "pip"
    directory: "/provisioner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
  - package-ecosystem: "pip"
    directory: "/status-page"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
  - package-ecosystem: "pip"
    directory: "/windows"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
  - package-ecosystem: "docker"
    directory: "/control-plane"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
  - package-ecosystem: "docker"
    directory: "/probe-worker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
  - package-ecosystem: "docker"
    directory: "/status-page"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
